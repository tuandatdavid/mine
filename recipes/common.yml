modules:
  - type: signing
  - type: brew
    nofile-limits: true # increase nofile limits
    brew-analytics: false
    direct-pull: true # dont pull caches
  - type: files
    files:
      - source: system   # copies `files/system/*` (* means everything inside it) into your image's root folder `/`
        destination: /
  - type: dnf
    repos:
      cleanup: false
      files:
        - codium.repo
        - gum.repo
        - netbird.repo
#        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://download.docker.com/linux/fedora/docker-ce.repo
        - https://negativo17.org/repos/fedora-steam.repo
      copr:
        - ublue-os/packages
        - cuteneko/waydroid-helper
        - bieszczaders/kernel-cachyos-addons
#      nonfree: rpmfusion
    install:
      allow-erasing: true
      packages:
        - gum
        - iwd
        - tuned
        - tuned-ppd
        - bolt
        - boltctl
        - adw-gtk3-theme
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - libguestfs-tools
        - python3-libguestfs
        - steam # just like on bazzite
        - distrobox
        - codium
        - uupd
        - waydroid
        - plymouth-plugin-script
        - plymouth-scripts
        - ImageMagick
        - waydroid-helper
        - wl-clipboard
        - gparted
        - sbsigntools
        - firewall-config
        - cachyos-settings
        - cachyos-ksm-settings
        - scx-manager
        - scx-tools
        - scx-scheds
        - pipewire-libs.i686
    remove:
      auto-remove: false
      packages:
        - zram-generator-defaults
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          title: Flathub
        install:
          - app.zen_browser.zen
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - net.nokyan.Resources
          - io.github.shiftey.Desktop
          - me.iepure.devtoolbox
          - org.libreoffice.LibreOffice
          - org.inkscape.Inkscape
          - org.gnome.DejaDup
          - io.github.celluloid_player.Celluloid
          - com.mattjakeman.ExtensionManager
          - org.gnome.TextEditor
          - com.github.wwmm.easyeffects
          - org.pipewire.Helvum
          - io.github.ungoogled_software.ungoogled_chromium
          - io.github.nozwock.Packet
          - org.gnome.Calculator
          - com.spotify.Client
          - io.github.nozwock.Packet
          - org.nickvision.tagger
          - io.github.vikdevelop.SaveDesktop
          - md.obsidian.Obsidian
          - com.heroicgameslauncher.hgl
          - org.nicotine_plus.Nicotine
          - org.virt_manager.virt-manager
          - com.github.Bleuzen.FFaudioConverter
          - com.sindresorhus.Caprine
  - type: systemd
    system:
      enabled:
        - uupd.service
        - netbird.service
#        - tailscaled.service
 #       - docker.service
        - libvirtd.service
      disabled:
        - rpm-ostreed-automatic.timer
        - bootc-fetch-apply-updates.timer
  - type: justfiles
    validate: true
    install: true
  - type: custom-kernel
    source: local
    kernel: cachyos-lto
  - type: script
    snippets:
      - "chmod +x /usr/bin/ugum"
      - "chmod +x /usr/share/bash-prexec"
      - "chmod +x /usr/libexec/bazzite-boot-remount"
      - "dnf5 install --setopt=tsflags=noscript -y netbird netbird-ui"
  #    - "rpm -i --nodigest $CONFIG_DIRECTORY/dnf/epson-inkjet-printer-escpr-1.8.6-1.src.rpm"
    #  - "rpm -i --nodigest $CONFIG_DIRECTORY/dnf/epson-printer-utility-1.2.2-1.x86_64.rpm"
    scripts:
#      - cachy-kernel.sh
      - plymouth.sh
      - segoefont.sh
  - type: script
    scripts:
      - signkernel.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'
  - type: os-release
    properties:
      NAME: Mine
      PRETTY_NAME: OSmine

