---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluefin-cachy
# description will be included in the image's metadata
description: My customized Universal Blue Bluefin image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: custom-kernel
    source: local
    kernel: cachyos-lto
  - type: files
    files:
      - source: system/etc   # copies `files/system/etc` (etc means etc inside it) into your image's /etc folder `/etc`
        destination: /etc
  - type: script
    scripts:
      - signkernel.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
  - type: dnf
    repos:
      cleanup: true
      files:
        - codium.repo
        - gum.repo
        - https://download.docker.com/linux/fedora/docker-ce.repo
      copr:
        - ublue-os/packages
        - cuteneko/waydroid-helper
        - bieszczaders/kernel-cachyos-addons
        - trixieua/morewaita-icon-theme
    install:
      allow-erasing: true
      packages:
        - adw-gtk3-theme
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - libguestfs-tools
        - steam # just like on bazzite
        - python3-libguestfs
        - codium
        - waydroid
        - ptyxis
        - plymouth-plugin-script
        - plymouth-scripts
        - ImageMagick
        - waydroid-helper
        - wl-clipboard
        - gparted
        - nautilus-python
        - python-dbus
        - cachyos-settings
        - cachyos-ksm-settings
        - scx-scheds
        - scx-manager
        - scx-tools
        - morewaita-icon-theme
    remove:
      packages:
       - zram-generator-defaults
  - type: justfiles
    validate: true
    include:
      - 20-spicetify.just
  - type: rpm-ostree
    repos:
      - netbird.repo
    install:
      - netbird
      - netbird-ui
      - gnome-shell-extension-appindicator
  - from-file: framework-gnome.yml
  - type: initramfs
  - type: signing
