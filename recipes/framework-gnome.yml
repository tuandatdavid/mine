modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
#        - zktaiga/fw-fanctrl
        - ublue-os/staging

      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - fw-fanctrl
        - fw-ectool
#        - framework-system
        - powertop
#        - gtkpod
        - dosfstools
  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          title: Flathub
        install: # system flatpaks we want all users to have and not remove
          - au.stevetech.yafi
          - org.gnome.Firmware
          - org.easycoding.TunedSwitcher
          - org.gnome.PowerStats
  - type: gnome-extensions
    install:
      - 7864 # Framework Fan Control
      - 5724 # Battery Health Charging
  #    - 1475 # Battery Time
  #    - 11611 # Galaxy Buds no support for GNOME 51
      - 2929 # Battery Time (Percentage) Compact
  - type: gschema-overrides
    include:
      - zz2-framework.gschema.override
#  - type: script
#    snippets:
#      - "plymouth-set-default-theme framework"
#  - type: initramfs
  - type: script
    snippets:
      - "plymouth-set-default-theme framework-penguin"
  - type: initramfs
